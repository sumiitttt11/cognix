<!doctype html>
<html lang="en" class="kdoc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console — Cognix</title>
<!-- The same policy as the app and the sign-in page: nothing but this origin,
     no inline script, no inline style. It matters here for one extra reason —
     this page reads and writes every account on the instance, so the one thing
     it must not be able to do is send any of that anywhere else. connect-src
     'self' is what makes that structural rather than a promise. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none';
  script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self';
  connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="same-origin">
<meta name="robots" content="noindex, nofollow">
<meta name="application-name" content="Cognix">
<meta name="theme-color" content="#1c1b1a">
<meta name="color-scheme" content="dark light">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/cognix-mark-64.png">
<link rel="icon" type="image/png" sizes="256x256" href="../assets/cognix-mark-256.png">
<link rel="apple-touch-icon" href="../assets/cognix-mark-256.png">
<!-- the app sheet carries the colour tokens, the fields and the buttons, so the
     console cannot drift away from the app; admin.css adds the console -->
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="./admin.css">
<script src="../vendor/react.js"></script>
<script src="../vendor/react-dom.js"></script>
<script src="../vendor/htm.js"></script>
</head>
<body class="kbody">
<div id="root"></div>
<noscript>
  <div class="crash" role="alert"><div class="crashcard">
    <h1>The console needs JavaScript</h1>
    <p>Every figure on this page is fetched from this server after it loads, and
       every change is sent the same way — the page's own security policy
       forbids it from posting anywhere.</p>
    <p>Turn JavaScript on for this site and reload.</p>
  </div></div>
</noscript>
<script type="module" src="./admin.js"></script>
</body>
</html>
