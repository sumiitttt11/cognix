<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Cognix</title>
<!-- Same policy as the app: nothing but this origin, no inline script, no
     inline style. `form-action 'none'` matters here more than anywhere else —
     it means a <form> on this page can never post to anything, so every form
     is handled in JavaScript with preventDefault(). That is deliberate: a
     sign-in form that could POST somewhere is the one thing this page must
     not have. The server sends the same policy as a header. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none';
  script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self';
  connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="same-origin">
<!-- A sign-in page has no business in a search index, and a reset link in the
     address bar has no business in a crawler's log. -->
<meta name="robots" content="noindex, nofollow">
<meta name="application-name" content="Cognix">
<meta name="theme-color" content="#1c1b1a">
<meta name="color-scheme" content="dark light">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/cognix-mark-64.png">
<link rel="icon" type="image/png" sizes="256x256" href="../assets/cognix-mark-256.png">
<link rel="apple-touch-icon" href="../assets/cognix-mark-256.png">
<!-- the app sheet carries the colour tokens and the field/button rules, so the
     two pages cannot drift apart; auth.css only adds the page itself -->
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="./auth.css">
<script src="../vendor/react.js"></script>
<script src="../vendor/react-dom.js"></script>
<script src="../vendor/htm.js"></script>
</head>
<body class="authbody">
<div id="root"></div>
<noscript>
  <div class="crash" role="alert"><div class="crashcard">
    <h1>Cognix needs JavaScript</h1>
    <p>Signing in happens in this tab: the form is sent by script, because the
       page's own security policy forbids it from posting anywhere.</p>
    <p>Turn JavaScript on for this site and reload.</p>
  </div></div>
</noscript>
<script type="module" src="./auth.js"></script>
</body>
</html>
