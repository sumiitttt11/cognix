<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cognix — Mind Maps</title>
<!-- Everything this page needs is served from this origin, and the only
     network call the app makes is to the same-origin /gw/ proxy. So the
     policy can be closed almost all the way: no inline script, no inline
     style, no third-party anything. The server sends the same policy as a
     header (plus frame-ancestors, which a meta tag cannot carry). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none';
  script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self';
  connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="same-origin">
<meta name="application-name" content="Cognix">
<meta name="description" content="Cognix turns one line about an idea into an editable
  six-branch mind map, then into a build plan — both written against a locked schema.">
<meta name="theme-color" content="#1c1b1a">
<meta name="color-scheme" content="dark light">
<link rel="icon" type="image/png" sizes="64x64" href="./assets/cognix-mark-64.png">
<link rel="icon" type="image/png" sizes="256x256" href="./assets/cognix-mark-256.png">
<link rel="apple-touch-icon" href="./assets/cognix-mark-256.png">
<link rel="stylesheet" href="./styles.css">
<!-- React is vendored locally: no build step, no CDN at runtime. The only
     outbound call this app makes is to the Cognix gateway. -->
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./vendor/htm.js"></script>
</head>
<body>
<div id="root"></div>
<noscript>
  <div class="crash" role="alert"><div class="crashcard">
    <h1>Cognix needs JavaScript</h1>
    <p>The whole app is a drawing surface — the boxes, the wires and the editing
       all run in this tab. There is no server-rendered version to fall back to.</p>
    <p>Turn JavaScript on for this site and reload.</p>
  </div></div>
</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
